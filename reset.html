<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Actualizar Series & Pelis</title>
  <style>
    body { font-family: system-ui, sans-serif; padding: 32px; background:#0b1020; color:#e9edff; }
  </style>
</head>
<body>
  <p>Actualizando la aplicación…</p>
  <script>
    (async () => {
      if ('serviceWorker' in navigator) {
        const regs = await navigator.serviceWorker.getRegistrations();
        await Promise.all(regs.map((reg) => reg.unregister()));
      }
      if ('caches' in window) {
        const keys = await caches.keys();
        await Promise.all(keys.map((key) => caches.delete(key)));
      }
      location.replace('./?v=1.2&fresh=' + Date.now());
    })();
  </script>
</body>
</html>
